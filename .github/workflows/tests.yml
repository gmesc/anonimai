name: tests

# Su main e su ogni pull request. Il push e' filtrato su main apposta: senza il
# filtro un branch aperto nello stesso repo farebbe girare due volte lo stesso
# job, una per il push e una per la PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # 3.11 e' il minimo dichiarato in requirements.txt, 3.14 la piu' recente.
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Nessun pip install: la suite in tests/ gira sulla sola libreria
      # standard. I generatori di dati (src/data_pipeline/) non hanno
      # dipendenze e src/app/detectors.py non importa torch/transformers/fitz,
      # quindi la rete regex+checksum e' verificabile senza il modello.
      # Installare torch qui costerebbe minuti e gigabyte per zero copertura
      # in piu': l'inferenza del modello non e' sotto test.
      - name: unittest discover
        run: python -m unittest discover -v tests

  # Vulnerabilita' note nelle dipendenze che finiscono nei binari. Non blocca la
  # CI — un avviso su una dipendenza di terzi non deve fermare una correzione
  # urgente — ma lascia una traccia datata: un difetto NOTO e taciuto e' l'unica
  # negligenza che nessuna licenza «cosi' com'e'» copre. Chi legge il job sa che
  # cosa c'era e quando. Vedi SECURITY.md.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: pip-audit sul freeze dell'ambiente
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement requirements-freeze-.venv.txt --desc \
            --format markdown | tee "$GITHUB_STEP_SUMMARY"
